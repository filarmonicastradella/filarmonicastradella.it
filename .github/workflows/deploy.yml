name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Ricostruzione periodica: aggiorna la galleria, che si legge alla build (gli eventi si caricano nel browser).
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Chiave pubblica (finisce nel codice del sito), limitata su Google Cloud alla Calendar API e al dominio
          PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ vars.PUBLIC_GOOGLE_CALENDAR_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
